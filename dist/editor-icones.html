<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor de Ícones — Metalúrgica Oliveira</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background:#0e0e0e; color:#eee; font-family:system-ui,sans-serif; }
    .editor-card { background:#1a1a1a; border:1px solid #333; border-radius:12px; }
    .preview-box { background:#fff; border-radius:8px; display:flex; align-items:center; justify-content:center; min-height:160px; padding:20px; }
    .preview-box svg { max-width:200px; max-height:160px; }
    textarea { font-family: monospace; font-size:.82rem; background:#0e0e0e; color:#a8ff78; border:1px solid #333; border-radius:8px; width:100%; }
    .tab-btn { background:none; border:none; color:#888; padding:.5rem 1rem; border-bottom:2px solid transparent; font-weight:600; cursor:pointer; }
    .tab-btn.active { color:#ffc107; border-bottom-color:#ffc107; }
    .icon-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:.8rem; }
    .icon-item { background:#222; border:2px solid #333; border-radius:8px; padding:1rem .5rem; text-align:center; cursor:pointer; transition:all .2s; }
    .icon-item:hover { border-color:#ffc107; }
    .icon-item.active { border-color:#ffc107; background:#2a2500; }
    .icon-item svg { width:60px; height:48px; }
    .icon-label { font-size:.65rem; color:#aaa; margin-top:.4rem; }
    .copy-btn { background:#ffc107; color:#000; border:none; border-radius:6px; padding:.4rem 1rem; font-weight:700; font-size:.82rem; cursor:pointer; }
    .copy-btn:hover { background:#e6a800; }
    h6 { color:#ffc107; font-size:.7rem; text-transform:uppercase; letter-spacing:.1em; margin-bottom:.8rem; }
  </style>
</head>
<body>
<div class="container-fluid py-4">
  <div class="row mb-4 align-items-center">
    <div class="col">
      <h1 class="h4 fw-bold mb-1">🔧 Editor de Ícones Técnicos</h1>
      <p class="text-muted small mb-0">Selecione um ícone, edite o SVG e copie o código para usar na calculadora.</p>
    </div>
    <div class="col-auto">
      <a href="calculadora.html" class="btn btn-outline-warning btn-sm fw-bold"><i class="bi bi-arrow-left me-1"></i>Voltar à Calculadora</a>
    </div>
  </div>

  <div class="row g-3">
    <!-- PAINEL ESQUERDO: Biblioteca de Ícones -->
    <div class="col-md-7">
      <div class="editor-card p-3">
        <!-- Tabs -->
        <div class="d-flex gap-1 mb-3 border-bottom border-secondary pb-2">
          <button class="tab-btn active" onclick="setTab('tesoura',this)">Tesouras</button>
          <button class="tab-btn" onclick="setTab('coluna',this)">Colunas</button>
          <button class="tab-btn" onclick="setTab('terca',this)">Terças</button>
          <button class="tab-btn" onclick="setTab('telha',this)">Telhas</button>
          <button class="tab-btn" onclick="setTab('fechamento',this)">Fechamentos</button>
          <button class="tab-btn" onclick="setTab('portao',this)">Portões</button>
        </div>
        <div class="icon-grid" id="iconGrid"></div>
      </div>
    </div>

    <!-- PAINEL DIREITO: Editor -->
    <div class="col-md-5">
      <div class="editor-card p-3">
        <h6>Preview ao vivo</h6>
        <div class="preview-box mb-3" id="previewBox">
          <svg viewBox="0 0 64 44" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="previewSvg">
            <text x="32" y="24" text-anchor="middle" fill="#ccc" font-size="9">Selecione um ícone</text>
          </svg>
        </div>
        <h6>Editar Paths SVG</h6>
        <p class="text-muted" style="font-size:.72rem">Cole ou edite os paths SVG abaixo. O viewBox é sempre <code>0 0 64 44</code>. Use apenas &lt;path&gt;, &lt;rect&gt;, &lt;circle&gt;.</p>
        <textarea rows="8" id="svgEditor" placeholder="<path d=&quot;M8 34 L32 10 L56 34&quot; />" oninput="updatePreview()"></textarea>
        <div class="d-flex gap-2 mt-2 align-items-center flex-wrap">
          <button class="copy-btn" onclick="copiarCodigo()"><i class="bi bi-clipboard me-1"></i>Copiar para HTML</button>
          <button class="btn btn-outline-secondary btn-sm" onclick="resetIcon()"><i class="bi bi-arrow-counterclockwise me-1"></i>Restaurar</button>
          <span id="copyMsg" class="text-success small" style="display:none">✔ Copiado!</span>
        </div>
        <hr class="border-secondary my-3">
        <h6>Código HTML Gerado</h6>
        <textarea rows="5" id="htmlOutput" readonly style="color:#7ec8e3" placeholder="Selecione um ícone acima para gerar o código..."></textarea>
      </div>
    </div>
  </div>
</div>

<script>
// Biblioteca de ícones (SVG paths apenas)
const ICONES = {
  tesoura: {
    'Duas Águas':        { vb:'0 0 64 44', d:<path d="M8 34 L32 10 L56 34" /><path d="M8 34 H56" /><path d="M32 10 V34" stroke-dasharray="3 2" stroke-width="1" /><path d="M20 22 H44" stroke-dasharray="3 2" stroke-width="1" /> },
    'Uma Água':          { vb:'0 0 64 44', d:<path d="M8 34 H56 V14" /><path d="M8 34 L56 14" /><path d="M8 34 V34 M56 14 V34" /> },
    'Arco Abaulado':     { vb:'0 0 64 44', d:<path d="M8 34 Q32 6 56 34" /><path d="M8 34 H56" /><path d="M8 34 V34 M56 34 V34" /> },
    'Arco Pleno':        { vb:'0 0 64 44', d:<path d="M8 34 Q18 2 32 2 Q46 2 56 34" /><path d="M8 34 H56" /> },
    'Shed (Dente Serra)':{ vb:'0 0 64 44', d:<path d="M8 34 V16 L22 30 V12 L36 26 V8 L50 22 V34" /><path d="M8 34 H56" /> },
    'Treliçada':         { vb:'0 0 64 44', d:<path d="M8 34 L32 10 L56 34" /><path d="M8 34 H56" /><path d="M8 34 L32 10 M32 10 L56 34 M8 26 H56 M20 18 L44 30 M44 18 L20 30" stroke-width="1" /> },
  },
  coluna: {
    'Perfil C':      { vb:'0 0 64 44', d:<path d="M22 8 H30 V36 H22" /><path d="M42 8 H34 V36 H42" /> },
    'Perfil W (I)':  { vb:'0 0 64 44', d:<path d="M18 10 H46 V14 H35 V30 H46 V34 H18 V30 H29 V14 H18 Z" /> },
    'Tubo Retang.':  { vb:'0 0 64 44', d:<rect x="20" y="10" width="24" height="24" /><rect x="24" y="14" width="16" height="16" /> },
    'Tubo Circ.':    { vb:'0 0 64 44', d:<circle cx="32" cy="22" r="12" /><circle cx="32" cy="22" r="8" /> },
    'Perfil I Lam.': { vb:'0 0 64 44', d:<path d="M14 12 H50 M14 32 H50" /><path d="M32 12 V32" stroke-width="2.6" /> },
  },
  terca: {
    'C Simples':     { vb:'0 0 64 40', d:<path d="M14 10 H24 V30 H14" /><path d="M50 10 H40 V30 H50" /> },
    'Z Enrijecida':  { vb:'0 0 64 40', d:<path d="M14 10 H26 V30 H38" /><path d="M14 14 V10 M38 26 V30" /> },
    'U Dobrada':     { vb:'0 0 64 40', d:<path d="M20 10 V30 H44 V10" /> },
    'Caixão':        { vb:'0 0 64 40', d:<rect x="16" y="12" width="32" height="16" /><path d="M32 12 V28" /> },
    'Tubular':       { vb:'0 0 64 40', d:<rect x="14" y="14" width="36" height="12" rx="1" /><rect x="18" y="17" width="28" height="6" rx="1" /> },
    'Treliçada':     { vb:'0 0 64 40', d:<path d="M8 14 H56 M8 26 H56" /><path d="M8 26 L20 14 L32 26 L44 14 L56 26" /> },
  },
  telha: {
    'Ondulada 0,43': { vb:'0 0 64 40', d:<path d="M4 22 q5 -7 10 0 q5 7 10 0 q5 -7 10 0 q5 7 10 0 q5 -7 10 0" /> },
    'Ondulada 0,50': { vb:'0 0 64 40', d:<path d="M4 20 q5 -7 10 0 q5 7 10 0 q5 -7 10 0 q5 7 10 0 q5 -7 10 0" stroke-width="2.6" /> },
    'Trapezoidal 40':{ vb:'0 0 64 40', d:<path d="M4 26 H10 L13 18 H18 L21 26 H30 L33 18 H38 L41 26 H50 L53 18 H58 L60 26" /> },
    'Trapezoidal 50':{ vb:'0 0 64 40', d:<path d="M4 27 H10 L14 14 H20 L24 27 H32 L36 14 H42 L46 27 H54 L58 14 H60" /> },
    'Trapezoidal 65':{ vb:'0 0 64 40', d:<path d="M4 28 H10 L14 12 H21 L25 28 H33 L37 12 H44 L48 28 H56 L60 12" stroke-width="2.8" /> },
    'Zipada':        { vb:'0 0 64 40', d:<path d="M4 26 H16 L16 14 L20 14 L20 26 H36 L36 14 L40 14 L40 26 H56 L56 14 L60 14" /> },
    'Sanduíche 30':  { vb:'0 0 64 40', d:<path d="M4 16 H60 M4 24 H60" /><path d="M8 16 L14 24 M18 16 L24 24 M28 16 L34 24 M38 16 L44 24 M48 16 L54 24" /> },
    'Sanduíche 50':  { vb:'0 0 64 40', d:<path d="M4 12 H60 M4 28 H60" /><path d="M8 12 L16 28 M20 12 L28 28 M32 12 L40 28 M44 12 L52 28" /> },
    'Autoportante':  { vb:'0 0 64 40', d:<path d="M4 30 Q32 6 60 30" /><path d="M8 30 Q32 11 56 30" /> },
    'Fibrocimento':  { vb:'0 0 64 40', d:<path d="M4 24 q6 -8 12 0 q6 8 12 0 q6 -8 12 0 q6 8 12 0" stroke-dasharray="6 2" /><path d="M4 30 H60" /> },
  },
  fechamento: {
    'Sem Fechamento':{ vb:'0 0 64 44', d:<path d="M8 36 H56" /><path d="M8 36 V14 M56 36 V14" stroke-dasharray="3 3" /> },
    'Oitão':         { vb:'0 0 64 44', d:<path d="M8 36 H56 M8 36 V14 M56 36 V14" stroke-dasharray="3 3" /><path d="M20 14 L32 8 L44 14 V36 H20 Z" /> },
    'Meia Parede':   { vb:'0 0 64 44', d:<path d="M8 14 V36 H56 V14" stroke-dasharray="3 3" /><rect x="8" y="24" width="48" height="12" /> },
    '3/4 da Altura': { vb:'0 0 64 44', d:<path d="M8 14 V36 H56 V14" stroke-dasharray="3 3" /><rect x="8" y="18" width="48" height="18" /> },
    'Completo':      { vb:'0 0 64 44', d:<rect x="8" y="14" width="48" height="22" /><path d="M22 14 V36 M36 14 V36 M50 14 V36" stroke-width="1" /> },
    'Alvenaria ½':   { vb:'0 0 64 44', d:<path d="M8 14 V36 H56 V14" stroke-dasharray="3 3" /><rect x="8" y="26" width="48" height="10" /><path d="M8 31 H56 M18 26 V31 M32 26 V31 M46 26 V31 M12 31 V36 M26 31 V36 M40 31 V36 M52 31 V36" /> },
  },
  portao: {
    'Sem Portão':    { vb:'0 0 64 44', d:<path d="M12 36 H52 M20 36 V20 M44 36 V20" stroke-dasharray="3 3" /> },
    'Basculante':    { vb:'0 0 64 44', d:<rect x="16" y="14" width="32" height="20" /><path d="M16 20 H48 M16 26 H48" /><path d="M52 14 q6 6 0 12" stroke-dasharray="3 2" /> },
    'Deslizante':    { vb:'0 0 64 44', d:<rect x="14" y="14" width="26" height="20" /><path d="M20 14 V34 M27 14 V34 M34 14 V34" stroke-width="1" /><path d="M12 37 H52" /><path d="M44 23 H54 M50 19 L54 23 L50 27" /> },
    'Duas Folhas':   { vb:'0 0 64 44', d:<rect x="14" y="14" width="36" height="20" /><path d="M32 14 V34" /><path d="M20 14 V34 M26 14 V34 M38 14 V34 M44 14 V34" stroke-width="1" /> },
    'De Enrolar':    { vb:'0 0 64 44', d:<path d="M14 10 H50" stroke-width="2.4" /><path d="M16 16 H48 M16 20 H48 M16 24 H48 M16 28 H48" /><path d="M14 34 H50" /> },
    'Seccionado':    { vb:'0 0 64 44', d:<rect x="14" y="14" width="36" height="20" /><path d="M14 20 H50 M14 26 H50" /><path d="M50 12 q6 2 6 8" stroke-dasharray="3 2" /> },
  },
};

let currentTab = 'tesoura';
let currentKey = null;
let currentOriginal = null;

function setTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('iconGrid');
  const icons = ICONES[currentTab];
  grid.innerHTML = '';
  for (const [name, data] of Object.entries(icons)) {
    const div = document.createElement('div');
    div.className = 'icon-item' + (name === currentKey ? ' active' : '');
    div.onclick = () => selectIcon(name, data, div);
    div.innerHTML = 
      <svg viewBox="" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
      <div class="icon-label"></div>
    ;
    grid.appendChild(div);
  }
}

function selectIcon(name, data, el) {
  document.querySelectorAll('.icon-item').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  currentKey = name;
  currentOriginal = data.d;
  document.getElementById('svgEditor').value = data.d;
  updatePreview();
}

function updatePreview() {
  const code = document.getElementById('svgEditor').value;
  const data = currentKey ? ICONES[currentTab][currentKey] : null;
  const vb   = data ? data.vb : '0 0 64 44';
  document.getElementById('previewSvg').outerHTML = <svg viewBox="" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="previewSvg"></svg>;
  
  // Gera HTML output
  const html = <svg viewBox="" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:70px;color:#555">\n\n</svg>;
  document.getElementById('htmlOutput').value = html;
}

function copiarCodigo() {
  const html = document.getElementById('htmlOutput').value;
  navigator.clipboard.writeText(html).then(() => {
    const msg = document.getElementById('copyMsg');
    msg.style.display = 'inline';
    setTimeout(() => msg.style.display = 'none', 2000);
  });
}

function resetIcon() {
  if (!currentOriginal) return;
  document.getElementById('svgEditor').value = currentOriginal;
  updatePreview();
}

renderGrid();
</script>
</body>
</html>

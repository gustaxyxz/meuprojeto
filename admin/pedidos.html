<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos — Admin Metalúrgica Oliveira</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --amarelo: #ffc107; --preto: #111; }
    body { background: #f4f5f7; font-family: 'Segoe UI', sans-serif; }
    .admin-nav { background: #111; padding: .75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    .admin-nav .brand { color: var(--amarelo); font-weight: 800; font-size: 1.05rem; }
    .admin-nav .nav-links a { color: #aaa; text-decoration: none; margin-left: 1.5rem; font-size: .88rem; font-weight: 600; transition: color .2s; }
    .admin-nav .nav-links a:hover, .admin-nav .nav-links a.active { color: #fff; }
    .admin-nav .btn-sair { background: none; border: 1px solid #444; color: #aaa; border-radius: 6px; padding: .3rem .8rem; font-size: .8rem; cursor: pointer; transition: all .2s; }
    .admin-nav .btn-sair:hover { border-color: #f88; color: #f88; }
    .page-header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 1.5rem 2rem; margin-bottom: 2rem; }
    .page-header h1 { font-size: 1.4rem; font-weight: 800; color: #111; margin: 0; }
    .page-header p { color: #777; font-size: .88rem; margin: .25rem 0 0; }
    .stats-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; padding: 0 2rem 1.5rem; }
    .stat-card { background: #fff; border-radius: 12px; padding: 1.2rem 1.5rem; border: 1px solid #e5e7eb; }
    .stat-card .stat-label { font-size: .75rem; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: .05em; }
    .stat-card .stat-val { font-size: 1.6rem; font-weight: 900; color: #111; margin-top: .2rem; }
    .stat-card .stat-val.amarelo { color: var(--amarelo); }
    .stat-card .stat-val.verde { color: #16a34a; }
    .stat-card .stat-val.vermelho { color: #dc2626; }
    .content-area { padding: 0 2rem 3rem; }
    .table-card { background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; overflow: hidden; }
    .table-card .table-toolbar { padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0f0f0; }
    .table-card .table-toolbar h5 { font-weight: 700; color: #111; margin: 0; font-size: 1rem; }
    .btn-novo { background: var(--amarelo); color: #000; border: none; border-radius: 8px; padding: .5rem 1.2rem; font-weight: 700; font-size: .88rem; cursor: pointer; transition: all .2s; text-decoration: none; display: inline-flex; align-items: center; gap: .4rem; }
    .btn-novo:hover { background: #e6a800; color: #000; }
    .table { margin: 0; }
    .table th { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #888; background: #fafafa; border-bottom: 2px solid #f0f0f0; padding: .8rem 1rem; }
    .table td { padding: .85rem 1rem; vertical-align: middle; font-size: .88rem; color: #333; border-bottom: 1px solid #f5f5f5; }
    .table tr:last-child td { border-bottom: none; }
    .table tr:hover td { background: #fafbff; }
    .btn-acao { border: none; border-radius: 6px; padding: .3rem .7rem; font-size: .78rem; font-weight: 600; cursor: pointer; transition: all .2s; text-decoration: none; display: inline-flex; align-items: center; gap: .3rem; }
    .btn-ver { background: #111; color: #fff; }
    .btn-ver:hover { background: #333; color: #fff; }
    .btn-pag { background: #16a34a; color: #fff; }
    .btn-pag:hover { background: #15803d; color: #fff; }
    .cliente-nome { font-weight: 700; color: #111; }
    .cliente-tel { color: #888; font-size: .8rem; }
    .valor-total { font-weight: 800; color: #111; }
    .saldo-devedor { font-size: .78rem; color: #dc2626; font-weight: 600; }
    .loading { text-align: center; padding: 3rem; color: #aaa; }
    .filtro-bar { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
    .filtro-bar select, .filtro-bar input { border: 1.5px solid #e5e7eb; border-radius: 8px; padding: .4rem .8rem; font-size: .82rem; color: #333; outline: none; }
    .filtro-bar select:focus, .filtro-bar input:focus { border-color: var(--amarelo); }
    .empty-state { text-align: center; padding: 4rem 2rem; color: #aaa; }
    .empty-state i { font-size: 3rem; display: block; margin-bottom: 1rem; color: #ddd; }
    @media(max-width:768px) { .stats-row { grid-template-columns: 1fr 1fr; } .content-area, .page-header { padding-left: 1rem; padding-right: 1rem; } }
  </style>
</head>
<body>

<nav class="admin-nav">
  <div class="brand"><i class="bi bi-hammer me-2"></i>Metalúrgica Oliveira <span style="color:#555;font-size:.8rem;font-weight:400">— Admin</span></div>
  <div class="nav-links">
    <a href="pedidos.html" class="active">Pedidos</a>
    <a href="novo-pedido.html">+ Novo Pedido</a>
    <a href="../orcamento-pdf.html" target="_blank" style="color:var(--amarelo);"><i class="bi bi-file-earmark-pdf me-1"></i>Gerador de PDF</a>
    <a href="../index.html" target="_blank">Ver Site</a>
    <button class="btn-sair ms-3" onclick="sair()"><i class="bi bi-box-arrow-right me-1"></i>Sair</button>
  </div>
</nav>

<div class="page-header">
  <h1><i class="bi bi-clipboard-data me-2" style="color:var(--amarelo)"></i>Painel de Pedidos</h1>
  <p>Gerencie todos os galpões vendidos, acompanhe pagamentos e gere extratos em PDF.</p>
</div>

<div class="stats-row" id="statsRow">
  <div class="stat-card"><div class="stat-label">Total de Pedidos</div><div class="stat-val" id="statTotal">—</div></div>
  <div class="stat-card"><div class="stat-label">Em Fabricação</div><div class="stat-val amarelo" id="statFab">—</div></div>
  <div class="stat-card"><div class="stat-label">Pagamento Pendente</div><div class="stat-val vermelho" id="statPend">—</div></div>
  <div class="stat-card"><div class="stat-label">Quitados</div><div class="stat-val verde" id="statQuit">—</div></div>
</div>

<div class="content-area">
  <div class="table-card">
    <div class="table-toolbar">
      <h5><i class="bi bi-list-ul me-2"></i>Todos os Pedidos</h5>
      <div class="d-flex gap-2 align-items-center flex-wrap">
        <div class="filtro-bar">
          <input type="text" id="busca" placeholder="Buscar cliente..." oninput="filtrar()">
          <select id="filtroStatus" onchange="filtrar()">
            <option value="">Todos os pagamentos</option>
            <option value="Pendente">Pagamento Pendente</option>
            <option value="Parcial">Pagamento Parcial</option>
            <option value="Quitado">Quitado</option>
          </select>
          <select id="filtroFab" onchange="filtrar()">
            <option value="">Toda fabricação</option>
            <option value="Em Fabricação">Em Fabricação</option>
            <option value="No Pátio">No Pátio</option>
            <option value="Pronto para Retirada">Pronto para Retirada</option>
            <option value="Entregue">Entregue</option>
          </select>
        </div>
        <a href="novo-pedido.html" class="btn-novo"><i class="bi bi-plus-lg"></i>Novo Pedido</a>
      </div>
    </div>

    <div id="tabelaContainer">
      <div class="loading"><i class="bi bi-arrow-repeat" style="animation:spin 1s linear infinite;font-size:2rem"></i><br>Carregando pedidos...</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-config.js"></script>
<script>
  // Proteção básica de acesso
  if (sessionStorage.getItem('admin_ok') !== 'true') location.href = 'index.html';

  function sair() { sessionStorage.removeItem('admin_ok'); location.href = 'index.html'; }

  let todosPedidos = [];

  async function carregarPedidos() {
    const { data, error } = await db
      .from('pedidos_vendas')
      .select(`
        *,
        clientes (nome, telefone, email, cidade),
        pagamentos_pedidos (valor_pago)
      `)
      .order('criado_em', { ascending: false });

    if (error) {
      document.getElementById('tabelaContainer').innerHTML = `<div class="loading text-danger"><i class="bi bi-exclamation-triangle"></i><br>Erro ao carregar: ${error.message}</div>`;
      return;
    }

    todosPedidos = (data || []).map(p => {
      const totalPago = (p.pagamentos_pedidos || []).reduce((a, b) => a + parseFloat(b.valor_pago), 0);
      return { ...p, totalPago, saldo: parseFloat(p.valor_total) - totalPago };
    });

    // Stats
    document.getElementById('statTotal').textContent = todosPedidos.length;
    document.getElementById('statFab').textContent = todosPedidos.filter(p => p.status_fabricacao === 'Em Fabricação').length;
    document.getElementById('statPend').textContent = todosPedidos.filter(p => p.status_pagamento !== 'Quitado').length;
    document.getElementById('statQuit').textContent = todosPedidos.filter(p => p.status_pagamento === 'Quitado').length;

    renderTabela(todosPedidos);
  }

  function filtrar() {
    const busca = document.getElementById('busca').value.toLowerCase();
    const status = document.getElementById('filtroStatus').value;
    const fab = document.getElementById('filtroFab').value;
    const filtrados = todosPedidos.filter(p => {
      const nome = (p.clientes?.nome || '').toLowerCase();
      const matchBusca = !busca || nome.includes(busca) || p.descricao_galpao.toLowerCase().includes(busca);
      const matchStatus = !status || p.status_pagamento === status;
      const matchFab = !fab || p.status_fabricacao === fab;
      return matchBusca && matchStatus && matchFab;
    });
    renderTabela(filtrados);
  }

  function renderTabela(lista) {
    if (lista.length === 0) {
      document.getElementById('tabelaContainer').innerHTML = `
        <div class="empty-state">
          <i class="bi bi-inbox"></i>
          <p>Nenhum pedido encontrado.</p>
          <a href="novo-pedido.html" class="btn-novo"><i class="bi bi-plus-lg"></i>Cadastrar Primeiro Pedido</a>
        </div>`;
      return;
    }

    let rows = lista.map(p => `
      <tr>
        <td>
          <div class="cliente-nome">${p.clientes?.nome || 'Cliente não encontrado'}</div>
          <div class="cliente-tel">${p.clientes?.telefone || ''} ${p.clientes?.cidade ? '· ' + p.clientes.cidade : ''}</div>
        </td>
        <td>${p.descricao_galpao}</td>
        <td>${fmtData(p.data_venda)}</td>
        <td>
          <div class="valor-total">${fmt(p.valor_total)}</div>
          ${p.saldo > 0 ? `<div class="saldo-devedor">Saldo: ${fmt(p.saldo)}</div>` : '<div style="color:#16a34a;font-size:.78rem;font-weight:700">✓ Quitado</div>'}
        </td>
        <td>${badgeFab(p.status_fabricacao)}</td>
        <td>${badgePag(p.status_pagamento)}</td>
        <td style="white-space:nowrap">
          <a href="proposta.html?id=${p.id_pedido}" class="btn-acao me-1" style="background:#7c3aed;color:#fff" title="Proposta / Orçamento em PDF"><i class="bi bi-file-text"></i>Proposta</a>
          <a href="pagamentos.html?id=${p.id_pedido}" class="btn-acao btn-pag me-1" title="Registrar pagamento recebido"><i class="bi bi-cash"></i>Pagar</a>
          <a href="extrato.html?id=${p.id_pedido}" class="btn-acao btn-ver" title="Extrato com comprovantes"><i class="bi bi-file-earmark-pdf"></i>Extrato</a>
        </td>
      </tr>`).join('');

    document.getElementById('tabelaContainer').innerHTML = `
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Galpão</th>
              <th>Data</th>
              <th>Financeiro</th>
              <th>Fabricação</th>
              <th>Pagamento</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  carregarPedidos();
</script>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</body>
</html>

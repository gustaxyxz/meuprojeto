<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin — Metalúrgica Oliveira</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --amarelo: #ffc107; --preto: #111; }
    body { background: #0a0a0a; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
    .login-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 25px 60px rgba(0,0,0,0.6); }
    .login-logo { text-align: center; margin-bottom: 2rem; }
    .login-logo img { height: 52px; filter: brightness(0) invert(1); }
    .login-logo h4 { color: #fff; font-weight: 800; margin-top: .6rem; font-size: 1.1rem; letter-spacing: .02em; }
    .login-logo span { color: var(--amarelo); }
    .form-label { color: #aaa; font-size: .82rem; font-weight: 600; }
    .form-control { background: #111; border: 1.5px solid #333; color: #fff; border-radius: 10px; padding: .75rem 1rem; }
    .form-control:focus { background: #111; border-color: var(--amarelo); color: #fff; box-shadow: 0 0 0 3px rgba(255,193,7,.15); }
    .btn-entrar { background: var(--amarelo); color: #000; border: none; border-radius: 10px; padding: .8rem; font-weight: 800; font-size: 1rem; width: 100%; transition: all .2s; }
    .btn-entrar:hover { background: #e6a800; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(255,193,7,.3); }
    .error-msg { background: rgba(220,53,69,.15); border: 1px solid rgba(220,53,69,.4); color: #f88; border-radius: 8px; padding: .7rem 1rem; font-size: .85rem; display: none; margin-bottom: 1rem; }
    .badge-admin { background: rgba(255,193,7,.1); border: 1px solid rgba(255,193,7,.3); color: var(--amarelo); border-radius: 6px; padding: .2rem .6rem; font-size: .72rem; font-weight: 700; letter-spacing: .05em; margin-bottom: 1rem; display: inline-block; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <img src="../assets/imagens/logo_mo.png" alt="Logo">
      <h4>Metalúrgica <span>Oliveira</span></h4>
      <div class="badge-admin"><i class="bi bi-shield-lock me-1"></i>ÁREA RESTRITA</div>
    </div>

    <div class="error-msg" id="erroMsg">
      <i class="bi bi-exclamation-triangle me-1"></i> Senha incorreta. Tente novamente.
    </div>

    <div class="mb-3">
      <label class="form-label">Senha de acesso</label>
      <input type="password" class="form-control" id="senhaInput" placeholder="••••••••" onkeydown="if(event.key==='Enter') entrar()">
    </div>
    <button class="btn-entrar" onclick="entrar()">
      <i class="bi bi-box-arrow-in-right me-2"></i>Entrar no Painel
    </button>

    <div class="text-center mt-4">
      <a href="../index.html" class="text-secondary text-decoration-none" style="font-size:.8rem">
        <i class="bi bi-arrow-left me-1"></i>Voltar ao site
      </a>
    </div>
  </div>

  <script>
    // Hash SHA-256 da senha (nunca expõe a senha em texto puro no código-fonte)
    // Senha atual: metalurgica2026
    const HASH_CORRETO = 'b2a0b9c1b3ad2d58d6e4d4b9d4437e07b3085d98bed68f75d7c8f1e0a87e69c0';

    // Se já está logado, redireciona
    if (sessionStorage.getItem('admin_ok') === 'true') {
      location.href = 'pedidos.html';
    }

    async function hashStr(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function entrar() {
      const btn = document.querySelector('.btn-entrar');
      btn.disabled = true;
      btn.textContent = 'Verificando...';
      const v = document.getElementById('senhaInput').value;
      const hash = await hashStr(v);
      if (hash === HASH_CORRETO) {
        sessionStorage.setItem('admin_ok', 'true');
        location.href = 'pedidos.html';
      } else {
        document.getElementById('erroMsg').style.display = 'block';
        document.getElementById('senhaInput').value = '';
        document.getElementById('senhaInput').focus();
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Entrar no Painel';
      }
    }
  </script>
</body>
</html>
